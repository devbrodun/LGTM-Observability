global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "vuln-observability"
    environment: "production"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# Load alert rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:

  # Prometheus self-scrape
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # System metrics — Node Exporter
  - job_name: "node-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          instance: "__VM_HOST__"
          env: "production"

  # HTTP/SSL probing — Blackbox Exporter
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          # BLACKBOX_HTTP_TARGETS_START
          - https://vuln-watch.hng14.com
          - https://staging.vuln-watch.hng14.com
          # BLACKBOX_HTTP_TARGETS_END
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: "https?://vuln-watch\\.hng14\\.com.*"
        target_label: service_name
        replacement: "vuln-watch frontend production"
      - source_labels: [__param_target]
        regex: "https?://staging\\.vuln-watch\\.hng14\\.com.*"
        target_label: service_name
        replacement: "vuln-watch frontend staging"
      - source_labels: [__param_target]
        regex: "https?://api\\.vuln-watch\\.hng14\\.com.*"
        target_label: service_name
        replacement: "vuln-watch backend production"
      - source_labels: [__param_target]
        regex: "https?://(api-staging|staging-api)\\.vuln-watch\\.hng14\\.com.*"
        target_label: service_name
        replacement: "vuln-watch backend staging"
      - target_label: __address__
        replacement: localhost:9115

  # SSL certificate expiry probing
  - job_name: "blackbox-ssl"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          # BLACKBOX_SSL_TARGETS_START
          - vuln-watch.hng14.com:443
          - staging.vuln-watch.hng14.com:443
          # BLACKBOX_SSL_TARGETS_END
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115

  # Blackbox exporter internal metrics
  - job_name: "blackbox-exporter"
    static_configs:
      - targets: ["localhost:9115"]

  # DORA metrics — GitHub Actions Exporter
  - job_name: "github-actions-exporter"
    scrape_interval: 60s  # GitHub API rate limit consideration
    static_configs:
      - targets: ["localhost:9999"]

  # OTel Collector internal metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["localhost:8888"]

  # Demo service metrics
  - job_name: "demo-service"
    static_configs:
      - targets: ["localhost:8080"]
    metrics_path: /metrics
